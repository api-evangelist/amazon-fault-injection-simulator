naftiko: 1.0.0-alpha1
info:
  label: AWS Fault Injection Simulator API
  description: Shared capability for AWS FIS, providing fault injection experiment management for chaos engineering.
  tags:
  - AWS FIS
  - Chaos Engineering
  - Resilience Testing
  - DevOps
  created: '2026-04-19'
  modified: '2026-04-19'
binds:
- namespace: env
  keys:
    AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
    AWS_REGION: AWS_REGION
capability:
  consumes:
  - type: http
    namespace: fis
    baseUri: https://fis.{region}.amazonaws.com
    description: AWS Fault Injection Simulator API
    authentication:
      type: apikey
      key: Authorization
      value: '{{AWS_ACCESS_KEY_ID}}'
      placement: header
    resources:
    - name: experiment-templates
      path: /experimentTemplates
      description: Experiment template management
      operations:
      - name: list-experiment-templates
        method: GET
        description: List experiment templates
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-experiment-template
        method: POST
        description: Create experiment template
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-experiment-template
        method: GET
        description: Get experiment template
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: update-experiment-template
        method: PATCH
        description: Update experiment template
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: delete-experiment-template
        method: DELETE
        description: Delete experiment template
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: experiments
      path: /experiments
      description: Experiment execution
      operations:
      - name: list-experiments
        method: GET
        description: List experiments
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: start-experiment
        method: POST
        description: Start experiment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-experiment
        method: GET
        description: Get experiment status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: stop-experiment
        method: DELETE
        description: Stop experiment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: actions
      path: /actions
      description: Available FIS actions
      operations:
      - name: list-actions
        method: GET
        description: List available actions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-action
        method: GET
        description: Get action details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: safety-levers
      path: /safetyLevers
      description: Safety lever management
      operations:
      - name: get-safety-lever
        method: GET
        description: Get safety lever status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: update-safety-lever-state
        method: PATCH
        description: Update safety lever state
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8100
    namespace: fis-rest
    resources:
    - path: /v1/experiment-templates
      name: experiment-templates
      description: Experiment templates
      operations:
      - method: GET
        name: list-experiment-templates
        description: List templates
        call: fis.list-experiment-templates
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: create-experiment-template
        description: Create template
        call: fis.create-experiment-template
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/experiments
      name: experiments
      description: Experiments
      operations:
      - method: GET
        name: list-experiments
        description: List experiments
        call: fis.list-experiments
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: start-experiment
        description: Start experiment
        call: fis.start-experiment
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/actions
      name: actions
      description: FIS actions
      operations:
      - method: GET
        name: list-actions
        description: List actions
        call: fis.list-actions
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9100
    namespace: fis-mcp
    transport: http
    tools:
    - name: list-experiment-templates
      description: List all FIS experiment templates
      hints:
        readOnly: true
      call: fis.list-experiment-templates
      outputParameters:
      - type: object
        mapping: $.
    - name: create-experiment-template
      description: Create a new fault injection experiment template
      hints:
        readOnly: false
      call: fis.create-experiment-template
      outputParameters:
      - type: object
        mapping: $.
    - name: get-experiment-template
      description: Get experiment template details
      hints:
        readOnly: true
      call: fis.get-experiment-template
      outputParameters:
      - type: object
        mapping: $.
    - name: update-experiment-template
      description: Update an experiment template
      hints:
        readOnly: false
      call: fis.update-experiment-template
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-experiment-template
      description: Delete an experiment template
      hints:
        readOnly: false
        destructive: true
      call: fis.delete-experiment-template
      outputParameters:
      - type: object
        mapping: $.
    - name: start-experiment
      description: Start a fault injection experiment from a template
      hints:
        readOnly: false
        destructive: true
      call: fis.start-experiment
      outputParameters:
      - type: object
        mapping: $.
    - name: get-experiment
      description: Get the current status and details of an experiment
      hints:
        readOnly: true
      call: fis.get-experiment
      outputParameters:
      - type: object
        mapping: $.
    - name: list-experiments
      description: List all FIS experiments and their status
      hints:
        readOnly: true
      call: fis.list-experiments
      outputParameters:
      - type: object
        mapping: $.
    - name: stop-experiment
      description: Stop a running fault injection experiment
      hints:
        readOnly: false
        destructive: true
      call: fis.stop-experiment
      outputParameters:
      - type: object
        mapping: $.
    - name: list-actions
      description: List all available FIS fault injection actions
      hints:
        readOnly: true
      call: fis.list-actions
      outputParameters:
      - type: object
        mapping: $.
    - name: get-action
      description: Get details of a specific FIS action
      hints:
        readOnly: true
      call: fis.get-action
      outputParameters:
      - type: object
        mapping: $.
    - name: get-safety-lever
      description: Get the status of a FIS safety lever
      hints:
        readOnly: true
      call: fis.get-safety-lever
      outputParameters:
      - type: object
        mapping: $.
    - name: update-safety-lever-state
      description: Engage or disengage a FIS safety lever to control experiment execution
      hints:
        readOnly: false
      call: fis.update-safety-lever-state
      outputParameters:
      - type: object
        mapping: $.
