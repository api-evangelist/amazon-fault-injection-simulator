naftiko: 1.0.0-alpha2
info:
  label: AWS FIS Chaos Engineering
  description: Workflow capability for executing chaos engineering experiments using AWS FIS. Enables resilience engineers
    and SREs to design, execute, and monitor fault injection experiments across AWS infrastructure.
  tags:
  - AWS FIS
  - Chaos Engineering
  - Resilience
  - SRE
  - DevOps
  created: '2026-04-19'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
    AWS_REGION: AWS_REGION
capability:
  consumes:
  - type: http
    namespace: fis
    baseUri: https://fis.{region}.amazonaws.com
    description: AWS Fault Injection Simulator API
    authentication:
      type: apikey
      key: Authorization
      value: '{{AWS_ACCESS_KEY_ID}}'
      placement: header
    resources:
    - name: experiment-templates
      path: /experimentTemplates
      description: Experiment template management
      operations:
      - name: list-experiment-templates
        method: GET
        description: List experiment templates
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-experiment-template
        method: POST
        description: Create experiment template
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-experiment-template
        method: GET
        description: Get experiment template
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: update-experiment-template
        method: PATCH
        description: Update experiment template
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: delete-experiment-template
        method: DELETE
        description: Delete experiment template
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: experiments
      path: /experiments
      description: Experiment execution
      operations:
      - name: list-experiments
        method: GET
        description: List experiments
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: start-experiment
        method: POST
        description: Start experiment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-experiment
        method: GET
        description: Get experiment status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: stop-experiment
        method: DELETE
        description: Stop experiment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: actions
      path: /actions
      description: Available FIS actions
      operations:
      - name: list-actions
        method: GET
        description: List available actions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-action
        method: GET
        description: Get action details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: safety-levers
      path: /safetyLevers
      description: Safety lever management
      operations:
      - name: get-safety-lever
        method: GET
        description: Get safety lever status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: update-safety-lever-state
        method: PATCH
        description: Update safety lever state
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: fis-chaos-api
    description: Unified REST API for AWS FIS chaos engineering workflows.
    resources:
    - path: /v1/experiment-templates
      name: experiment-templates
      description: Manage experiment templates
      operations:
      - method: GET
        name: list-experiment-templates
        description: List templates
        call: fis.list-experiment-templates
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: create-experiment-template
        description: Create template
        call: fis.create-experiment-template
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/experiment-templates/{id}
      name: experiment-template
      description: Manage specific template
      operations:
      - method: GET
        name: get-experiment-template
        description: Get template
        call: fis.get-experiment-template
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: update-experiment-template
        description: Update template
        call: fis.update-experiment-template
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: delete-experiment-template
        description: Delete template
        call: fis.delete-experiment-template
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/experiments
      name: experiments
      description: Manage experiments
      operations:
      - method: GET
        name: list-experiments
        description: List experiments
        call: fis.list-experiments
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: start-experiment
        description: Start experiment
        call: fis.start-experiment
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/experiments/{id}
      name: experiment
      description: Manage specific experiment
      operations:
      - method: GET
        name: get-experiment
        description: Get experiment
        call: fis.get-experiment
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: stop-experiment
        description: Stop experiment
        call: fis.stop-experiment
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/safety-levers/{id}
      name: safety-lever
      description: Safety lever control
      operations:
      - method: GET
        name: get-safety-lever
        description: Get safety lever
        call: fis.get-safety-lever
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: update-safety-lever-state
        description: Update safety lever state
        call: fis.update-safety-lever-state
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: fis-chaos-mcp
    transport: http
    description: MCP server for AI-assisted chaos engineering with AWS FIS.
    tools:
    - name: list-experiment-templates
      description: List all fault injection experiment templates
      hints:
        readOnly: true
        openWorld: true
      call: fis.list-experiment-templates
      outputParameters:
      - type: object
        mapping: $.
    - name: create-experiment-template
      description: Design a new fault injection scenario with targets, actions, and stop conditions
      hints:
        readOnly: false
      call: fis.create-experiment-template
      outputParameters:
      - type: object
        mapping: $.
    - name: get-experiment-template
      description: Get the configuration of an experiment template
      hints:
        readOnly: true
      call: fis.get-experiment-template
      outputParameters:
      - type: object
        mapping: $.
    - name: update-experiment-template
      description: Modify targets, actions, or stop conditions of an experiment template
      hints:
        readOnly: false
      call: fis.update-experiment-template
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-experiment-template
      description: Remove an experiment template
      hints:
        readOnly: false
        destructive: true
      call: fis.delete-experiment-template
      outputParameters:
      - type: object
        mapping: $.
    - name: start-experiment
      description: Execute a fault injection experiment from a template
      hints:
        readOnly: false
        destructive: true
      call: fis.start-experiment
      outputParameters:
      - type: object
        mapping: $.
    - name: get-experiment
      description: Monitor the status and progress of a fault injection experiment
      hints:
        readOnly: true
      call: fis.get-experiment
      outputParameters:
      - type: object
        mapping: $.
    - name: list-experiments
      description: List all experiments and their current status
      hints:
        readOnly: true
      call: fis.list-experiments
      outputParameters:
      - type: object
        mapping: $.
    - name: stop-experiment
      description: Abort a running fault injection experiment
      hints:
        readOnly: false
        destructive: true
      call: fis.stop-experiment
      outputParameters:
      - type: object
        mapping: $.
    - name: list-actions
      description: Discover all available fault injection action types
      hints:
        readOnly: true
      call: fis.list-actions
      outputParameters:
      - type: object
        mapping: $.
    - name: get-action
      description: Get details and parameters for a specific FIS action
      hints:
        readOnly: true
      call: fis.get-action
      outputParameters:
      - type: object
        mapping: $.
    - name: get-safety-lever
      description: Check the status of a safety lever for experiment control
      hints:
        readOnly: true
      call: fis.get-safety-lever
      outputParameters:
      - type: object
        mapping: $.
    - name: update-safety-lever-state
      description: Engage or disengage a safety lever to allow or block experiments
      hints:
        readOnly: false
      call: fis.update-safety-lever-state
      outputParameters:
      - type: object
        mapping: $.
