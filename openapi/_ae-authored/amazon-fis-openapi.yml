        id:
          type: string
          description: Safety lever ID
          example: SL123
        arn:
          type: string
          description: Safety lever ARN
          example: arn:aws:fis:us-east-1:123456789012:safety-lever/SL123
        state:
          $ref: '#/components/schemas/SafetyLeverState'
    SafetyLeverState:
      type: object
