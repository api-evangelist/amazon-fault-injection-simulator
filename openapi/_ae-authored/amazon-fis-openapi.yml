  /tags/{resourceArn}:
    get:
      operationId: listTagsForResource
      summary: AWS Fault Injection Simulator List Tags for Resource
      description: Lists the tags for the specified resource.
      tags:
      - Tagging
      parameters:
      - name: resourceArn
        in: path
        required: true
        description: Resource ARN
        schema:
          type: string
      responses:
        '200':
          description: Tags returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTagsResponse'
              examples:
                ListTagsForResource200Example:
                  summary: Default response
                  x-microcks-default: true
                  value:
                    tags:
                      Environment: test
                      Team: platform
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    post:
      operationId: tagResource
      summary: AWS Fault Injection Simulator Tag a Resource
      description: Applies tags to the specified resource.
      tags:
      - Tagging
      parameters:
      - name: resourceArn
        in: path
        required: true
        description: Resource ARN
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagResourceRequest'
            examples:
              TagResourceRequestExample:
                summary: Default request
                x-microcks-default: true
                value:
                  tags:
                    Environment: test
                    Team: platform
      responses:
        '200':
          description: Tags applied
          content:
            application/json:
              schema:
                type: object
              examples:
                TagResource200Example:
                  summary: Default response
                  x-microcks-default: true
                  value: {}
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    delete:
      operationId: untagResource
      summary: AWS Fault Injection Simulator Untag a Resource
      description: Removes tags from the specified resource.
      tags:
      - Tagging
      parameters:
      - name: resourceArn
        in: path
        required: true
        description: Resource ARN
        schema:
          type: string
      - name: tagKeys
        in: query
        description: Tag keys to remove
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Tags removed
          content:
            application/json:
              schema:
                type: object
              examples:
                UntagResource200Example:
                  summary: Default response
                  x-microcks-default: true
                  value: {}
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  securitySchemes:
    aws_signature_v4:
      type: apiKey
      in: header
      name: Authorization
      description: AWS Signature Version 4 authentication
  schemas:
    ExperimentTemplate:
      type: object
      description: An experiment template defining fault injection targets, actions, and stop conditions
      properties:
        id:
          type: string
          description: Template ID
          example: EXT123
        arn:
          type: string
          description: Template ARN
          example: arn:aws:fis:us-east-1:123456789012:experiment-template/EXT123
        description:
          type: string
          description: Template description
          example: Test EC2 instance failure
        targets:
          type: object
          description: Target definitions
          additionalProperties:
            $ref: '#/components/schemas/ExperimentTemplateTarget'
        actions:
          type: object
          description: Action definitions
          additionalProperties:
            $ref: '#/components/schemas/ExperimentTemplateAction'
        stopConditions:
          type: array
          description: Stop conditions
          items:
            $ref: '#/components/schemas/ExperimentTemplateStopCondition'
        creationTime:
          type: string
          format: date-time
          description: Template creation time
          example: '2026-04-19T12:00:00Z'
        lastUpdateTime:
          type: string
          format: date-time
          description: Last update time
        roleArn:
          type: string
          description: IAM role ARN for experiment execution
        tags:
          type: object
          description: Resource tags
          additionalProperties:
            type: string
    ExperimentTemplateTarget:
      type: object
      description: Target definition in an experiment template
      properties:
        resourceType:
          type: string
          description: AWS resource type
          example: aws:ec2:instance
        resourceArns:
          type: array
          description: Specific resource ARNs
          items:
            type: string
        resourceTags:
          type: object
          description: Tags to filter resources
          additionalProperties:
            type: string
        filters:
          type: array
          description: Resource filters
          items:
            type: object
