            type: object
        actions:
          type: object
          description: Experiment actions
          additionalProperties:
            type: object
        stopConditions:
          type: array
          description: Stop conditions
          items:
            type: object
        startTime:
          type: string
          format: date-time
          description: Experiment start time
        endTime:
          type: string
          format: date-time
          description: Experiment end time
        tags:
          type: object
          description: Resource tags
          additionalProperties:
            type: string
    ExperimentState:
      type: object
      description: Current state of an experiment
      properties:
        status:
          type: string
          description: Experiment status
          example: running
          enum:
          - pending
          - initiating
          - running
          - completed
          - stopping
          - stopped
          - failed
        reason:
          type: string
