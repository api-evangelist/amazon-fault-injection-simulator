      parameters:
      - name: id
        in: path
        required: true
        description: Experiment ID
        schema:
          type: string
        example: EXP123
      responses:
        '200':
          description: Experiment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentResponse'
              examples:
                GetExperiment200Example:
                  summary: Default response
                  x-microcks-default: true
                  value:
                    experiment:
                      id: EXP123
                      experimentTemplateId: EXT123
                      state:
                        status: running
                        reason: Experiment running normally
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    delete:
      operationId: stopExperiment
      summary: AWS Fault Injection Simulator Stop Experiment
      description: Stops the specified experiment.
      tags:
