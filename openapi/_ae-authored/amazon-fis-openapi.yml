      parameters:
      - name: id
        in: path
        required: true
        description: Experiment ID
        schema:
          type: string
      responses:
        '200':
          description: Experiment stopped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentResponse'
              examples:
                StopExperiment200Example:
                  summary: Default response
                  x-microcks-default: true
                  value:
                    experiment:
                      id: EXP123
                      state:
                        status: stopping
        '404':
          description: Not found
          content:
